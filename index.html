<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Poste de Kenza</title>
<meta name="theme-color" content="#22306A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Poste de Kenza">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Kalam:wght@300;400;700&display=swap">
<style>
:root {
  --ciel: #E3EAF3;
  --ciel-2: #D3DDEA;
  --encre: #22306A;
  --encre-douce: #4B5687;
  --rouge: #C53A43;
  --papier: #FCFCF8;
  --tampon: #3E4566;
  --rose: #E99AAA;
  --texte: #1E2547;
  --ligne: rgba(34, 48, 106, 0.14);
  --ombre: 0 1px 2px rgba(30, 37, 71, 0.10), 0 8px 24px -12px rgba(30, 37, 71, 0.35);
  --main: "Kalam", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
  --ui: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --lh: 2.1rem;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --ciel: #141B36;
    --ciel-2: #1D2647;
    --texte: #E3EAF3;
    --encre-douce: #AEB8E0;
    --ligne: rgba(34, 48, 106, 0.16);
    color-scheme: dark;
  }
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100%;
  background: var(--ciel);
  color: var(--texte);
  font-family: var(--ui);
  font-size: 1rem;
  line-height: 1.5;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--rouge); outline-offset: 3px; border-radius: 4px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.page { max-width: 34rem; margin: 0 auto; padding: 1.25rem 1.1rem 5rem; }

/* ---------- Bandeau du haut ---------- */
.masthead { display: flex; align-items: center; gap: 0.9rem; margin: 0.5rem 0 1.75rem; }
.masthead h1 {
  font-family: var(--main);
  font-weight: 700;
  font-size: 2.1rem;
  line-height: 1.05;
  margin: 0;
  color: var(--texte);
}
.masthead p { margin: 0.2rem 0 0; color: var(--encre-douce); font-size: 0.98rem; }
.masthead .stamp { flex: none; transform: rotate(-6deg); }

h2.section {
  font-family: var(--main);
  font-weight: 700;
  font-size: 1.45rem;
  margin: 2.2rem 0 0.8rem;
  color: var(--texte);
}
.note { color: var(--encre-douce); font-size: 0.95rem; margin: 0.4rem 0 0; }
.en-chemin { display: flex; align-items: center; gap: 0.5rem; margin: 0.9rem 0 0; color: var(--encre-douce); font-size: 0.95rem; }
.en-chemin svg { flex: none; }

/* ---------- Timbre ---------- */
.stamp {
  --sz-w: 48px; --sz-h: 56px;
  width: var(--sz-w); height: var(--sz-h);
  padding: 4px;
  background: radial-gradient(circle, transparent 2.3px, #fff 2.7px) -4px -4px / 8px 8px;
  filter: drop-shadow(0 1px 1px rgba(30, 37, 71, 0.25));
  display: block;
}
.stamp-face {
  width: 100%; height: 100%;
  background: var(--stamp, var(--rose));
  display: grid; place-items: center;
  position: relative;
  color: #fff;
}
.stamp-face svg { width: 60%; height: auto; }
.stamp-face small {
  position: absolute; bottom: 1px; right: 3px;
  font-family: var(--ui); font-size: 9px; font-weight: 700; line-height: 1;
}
.stamp--rose  { --stamp: #E58FA0; }
.stamp--bleu  { --stamp: #6C8CD5; }
.stamp--sauge { --stamp: #77A487; }
.stamp--miel  { --stamp: #DDA843; }

/* ---------- Enveloppe (petite) ---------- */
.pile { display: grid; gap: 1.1rem; }
.env {
  position: relative;
  display: block;
  width: 100%;
  border: 0;
  padding: 7px;
  border-radius: 7px;
  background: repeating-linear-gradient(-45deg,
    var(--rouge) 0 9px, #fff 9px 15px, var(--encre) 15px 24px, #fff 24px 30px);
  box-shadow: var(--ombre);
  text-align: left;
  transition: transform 160ms ease;
}
.pile .env:nth-child(odd) { transform: rotate(-1.1deg); }
.pile .env:nth-child(even) { transform: rotate(0.8deg); }
.env:active { transform: scale(0.98) rotate(0deg) !important; }
.env-inner {
  position: relative;
  min-height: 9.5rem;
  background: var(--papier);
  border-radius: 2px;
  padding: 1rem 1.1rem;
  display: grid;
  grid-template-columns: 1fr auto;
  grid-template-rows: auto 1fr auto;
  color: var(--encre);
}
.env-inner .stamp { grid-column: 2; grid-row: 1; }
.env-postmark {
  position: absolute; top: 0.7rem; right: 1.5rem;
  width: 112px; height: 54px;
  color: var(--tampon); opacity: 0.6;
  transform: rotate(-8deg);
  pointer-events: none;
}
.par-amour {
  grid-column: 1; grid-row: 1; align-self: start; justify-self: start;
  background: var(--encre); color: #fff;
  font-family: var(--ui); font-size: 0.7rem; font-weight: 700; letter-spacing: 0.04em;
  padding: 0.2rem 0.45rem; border-radius: 2px;
  text-transform: uppercase;
}
.env-to {
  grid-column: 1 / -1; grid-row: 2; align-self: end;
  font-family: var(--main); font-size: 1.6rem; line-height: 1.2;
  padding-left: 18%;
}
.env-to span { display: block; font-size: 1.05rem; color: var(--encre-douce); }
.env-meta { grid-column: 1 / -1; grid-row: 3; font-size: 0.82rem; color: var(--encre-douce); margin-top: 0.4rem; padding-left: 18%; }

/* Enveloppes « à ouvrir quand » */
.quand-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.9rem; }
.quand-grid .env { padding: 5px; }
.quand-grid .env-inner { min-height: 7.5rem; padding: 0.7rem 0.75rem; grid-template-columns: 1fr auto; }
.quand-grid .stamp { --sz-w: 32px; --sz-h: 40px; padding: 4px; }
.quand-grid .stamp-face small { display: none; }
.quand-grid .env-to { font-size: 1.1rem; padding-left: 0; }
.quand-grid .env-to span { font-size: 0.85rem; }
.quand-grid .env:nth-child(odd) { transform: rotate(-1.4deg); }
.quand-grid .env:nth-child(even) { transform: rotate(1.2deg); }

/* ---------- Carte-réponse (aperçu) ---------- */
.carte-teaser {
  display: block; width: 100%;
  border: 0; text-align: left;
  background: var(--papier);
  color: var(--encre);
  border-radius: 4px;
  padding: 1rem 3.8rem 1rem 1.25rem;
  box-shadow: var(--ombre);
  position: relative;
  transform: rotate(0.6deg);
  border-left: 7px solid var(--rose);
}
.carte-teaser strong { display: block; font-family: var(--main); font-size: 1.4rem; line-height: 1.2; }
.carte-teaser .desc { display: block; font-size: 0.92rem; color: var(--encre-douce); }
.carte-teaser .stamp { position: absolute; top: 0.7rem; right: 0.8rem; --sz-w: 32px; --sz-h: 40px; }
.carte-teaser .stamp-face small { display: none; }

/* ---------- Archive ---------- */
.archive { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--ciel-2); }
.archive li { border-bottom: 1px solid var(--ciel-2); }
.archive button {
  width: 100%; border: 0; background: none; text-align: left;
  display: grid; grid-template-columns: auto 1fr auto; gap: 0.85rem; align-items: center;
  padding: 0.8rem 0.2rem;
}
.archive .mini {
  width: 34px; height: 24px; border-radius: 3px;
  background: repeating-linear-gradient(-45deg, var(--rouge) 0 4px, #fff 4px 6px, var(--encre) 6px 10px, #fff 10px 12px);
  padding: 3px;
}
.archive .mini i { display: block; width: 100%; height: 100%; background: var(--papier); border-radius: 1px; }
.archive .t { font-family: var(--main); font-size: 1.15rem; line-height: 1.25; display: block; }
.archive .d { font-size: 0.82rem; color: var(--encre-douce); }
.archive .coeur { color: var(--rouge); font-size: 1.1rem; }

.vide {
  border: 2px dashed var(--ciel-2);
  border-radius: 8px;
  padding: 1.4rem 1.2rem;
  text-align: center;
  color: var(--encre-douce);
}
.vide strong { display: block; font-family: var(--main); font-size: 1.35rem; color: var(--texte); font-weight: 700; }

/* ---------- Boutons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
  border: 0; border-radius: 999px;
  padding: 0.8rem 1.35rem;
  font-weight: 600;
  background: var(--encre); color: #fff;
  min-height: 48px;
}
.btn:active { transform: translateY(1px); }
.btn--rouge { background: var(--rouge); }
.btn--clair { background: transparent; color: var(--texte); box-shadow: inset 0 0 0 1.5px currentColor; }
.btn--lien { background: none; color: var(--encre-douce); padding: 0.4rem 0.2rem; min-height: auto; text-decoration: underline; text-underline-offset: 3px; font-weight: 500; }
.btn[disabled] { opacity: 0.45; cursor: default; }
.btn-row { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; }

/* ---------- Côté Sammy ---------- */
.onglets {
  display: grid; grid-template-columns: repeat(3, 1fr);
  background: var(--ciel-2);
  border-radius: 999px; padding: 4px; margin: 0 0 1.4rem;
}
.onglets button {
  border: 0; background: none; border-radius: 999px;
  padding: 0.6rem 0.4rem; font-weight: 600; font-size: 0.92rem; color: var(--encre-douce);
  position: relative;
}
.onglets button[aria-selected="true"] { background: var(--papier); color: var(--encre); box-shadow: 0 1px 3px rgba(30,37,71,.18); }
.onglets .pastille {
  position: absolute; top: 4px; right: 10%;
  width: 9px; height: 9px; border-radius: 50%; background: var(--rouge);
}

.alerte-reponse {
  background: var(--papier); color: var(--encre);
  border-radius: 6px; box-shadow: var(--ombre);
  padding: 0.95rem 1.1rem; margin: 0 0 1.3rem;
  border-left: 6px solid var(--rose);
}
.alerte-reponse p { margin: 0 0 0.6rem; }
.alerte-reponse b { font-family: var(--main); font-size: 1.2rem; font-weight: 700; }

.champ { margin: 0 0 1.15rem; }
.champ > label, .champ > .lab { display: block; font-weight: 600; font-size: 0.92rem; margin: 0 0 0.4rem; }
.champ input:not([type="radio"]):not([type="checkbox"]), .champ textarea {
  width: 100%;
  border: 1.5px solid var(--ciel-2);
  background: var(--papier); color: var(--encre);
  border-radius: 8px;
  padding: 0.7rem 0.8rem;
  min-height: 48px;
}
.champ input:focus, .champ textarea:focus { outline: none; border-color: var(--encre); }
.choix { display: flex; flex-wrap: wrap; gap: 0.45rem; }
.choix label {
  display: inline-flex; align-items: center; gap: 0.4rem;
  padding: 0.5rem 0.9rem; border-radius: 999px;
  background: var(--ciel-2); font-size: 0.92rem; font-weight: 500;
  cursor: pointer;
}
.choix input { accent-color: var(--encre); margin: 0; }
.choix label:has(input:checked) { background: var(--encre); color: #fff; }
.choix label:has(input:focus-visible) { outline: 3px solid var(--rouge); outline-offset: 2px; }
.idees { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.5rem; }
.idees button {
  border: 1px solid var(--ciel-2); background: transparent;
  border-radius: 999px; padding: 0.3rem 0.7rem; font-size: 0.85rem; color: var(--encre-douce);
}
.tag {
  display: inline-flex; align-items: center; gap: 0.5rem;
  background: var(--papier); color: var(--encre);
  border-radius: 6px; padding: 0.45rem 0.6rem 0.45rem 0.8rem;
  border-left: 5px solid var(--rose);
  font-size: 0.92rem;
}
.tag button { border: 0; background: none; font-size: 1.1rem; line-height: 1; padding: 0.1rem 0.3rem; color: var(--encre-douce); }

textarea.feuille {
  font-family: var(--main) !important;
  font-size: 1.15rem;
  line-height: var(--lh);
  min-height: calc(var(--lh) * 11);
  padding: 0.55rem 1rem !important;
  background-color: var(--papier) !important;
  background-image: linear-gradient(transparent calc(var(--lh) - 1px), var(--ligne) 1px);
  background-size: 100% var(--lh);
  background-position: 0 0.55rem;
  background-attachment: local;
  resize: vertical;
}
.petit { font-size: 0.82rem; color: var(--encre-douce); margin: 0.35rem 0 0; }

.liste-cartes { display: grid; gap: 0.9rem; }
.carte-envoyee {
  background: var(--papier); color: var(--encre);
  border-radius: 6px; padding: 0.95rem 1.05rem;
  box-shadow: 0 1px 2px rgba(30,37,71,.12);
}
.carte-envoyee h3 { font-family: var(--main); font-size: 1.2rem; font-weight: 700; margin: 0 0 0.35rem; }
.carte-envoyee ul { margin: 0 0 0.6rem; padding-left: 1.1rem; font-size: 0.92rem; }
.carte-envoyee li.coche { font-weight: 700; color: var(--rouge); }
.statut { font-size: 0.85rem; color: var(--encre-douce); margin: 0 0 0.5rem; }

.envoyes { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.6rem; }
.envoyes button {
  width: 100%; border: 0; text-align: left;
  background: var(--papier); color: var(--encre);
  border-radius: 6px; padding: 0.75rem 0.9rem;
  display: grid; grid-template-columns: auto 1fr auto; gap: 0.8rem; align-items: center;
  box-shadow: 0 1px 2px rgba(30,37,71,.12);
}
.envoyes .stamp { --sz-w: 24px; --sz-h: 30px; padding: 3px; background-size: 6px 6px; background-position: -3px -3px; background-image: radial-gradient(circle, transparent 1.6px, #fff 2px); }
.envoyes .stamp-face svg { width: 70%; }
.envoyes .stamp-face small { display: none; }
.envoyes .t { font-family: var(--main); font-size: 1.1rem; line-height: 1.25; display: block; }
.envoyes .d { font-size: 0.82rem; color: var(--encre-douce); }
.envoyes .etat { font-size: 0.78rem; font-weight: 600; padding: 0.2rem 0.55rem; border-radius: 999px; background: var(--ciel); color: var(--encre); white-space: nowrap; }
.envoyes .etat--ouverte { background: #DDEEE2; color: #245A36; }
.envoyes .etat--route { background: #FBEBC8; color: #6B4A06; }

.barre-apercu {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--encre); color: #fff;
  padding: 0.6rem 1rem;
  display: flex; align-items: center; justify-content: space-between; gap: 0.8rem;
  font-size: 0.9rem;
}
.barre-apercu button { border: 0; background: #fff; color: var(--encre); border-radius: 999px; padding: 0.4rem 0.85rem; font-weight: 600; font-size: 0.85rem; }

.demo {
  background: #FBEBC8; color: #4A3404;
  font-size: 0.85rem; padding: 0.6rem 1rem;
  display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.9rem; justify-content: center;
}
.demo .seg { display: inline-flex; background: rgba(74,52,4,.12); border-radius: 999px; padding: 3px; }
.demo .seg button { border: 0; background: none; border-radius: 999px; padding: 0.25rem 0.75rem; font-weight: 600; font-size: 0.82rem; color: #4A3404; }
.demo .seg button[aria-pressed="true"] { background: #fff; }
.demo .reset { border: 0; background: none; text-decoration: underline; font-size: 0.82rem; color: #4A3404; }

.pied { margin-top: 3rem; text-align: center; }

/* ---------- Écrans connexion / chargement ---------- */
.ecran {
  min-height: 100%;
  display: grid; place-items: center;
  padding: 2rem 1.2rem;
  text-align: center;
}
.ecran .bloc { max-width: 22rem; }
.ecran h1 { font-family: var(--main); font-size: 2.3rem; line-height: 1.1; margin: 1.4rem 0 0.5rem; }
.ecran p { color: var(--encre-douce); margin: 0 0 1.4rem; }
.ecran .env { pointer-events: none; transform: rotate(-3deg); max-width: 19rem; margin: 0 auto; }
.erreur { background: #F8DADC; color: #6E1219; border-radius: 6px; padding: 0.7rem 0.9rem; font-size: 0.9rem; text-align: left; margin: 1rem 0 0; }
.chargement { width: 40px; height: 40px; border-radius: 50%; border: 3px solid var(--ciel-2); border-top-color: var(--encre); animation: tourne 0.9s linear infinite; margin: 0 auto; }
@keyframes tourne { to { transform: rotate(360deg); } }

/* ---------- Superpositions ---------- */
.voile {
  position: fixed; inset: 0; z-index: 20;
  background: rgba(16, 22, 46, 0.62);
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
  overflow-y: auto;
  padding: calc(env(safe-area-inset-top, 0px) + 1rem) 1rem calc(env(safe-area-inset-bottom, 0px) + 2rem);
  display: flex; flex-direction: column; align-items: center;
  animation: apparait 200ms ease;
}
@keyframes apparait { from { opacity: 0; } }
.voile--centre { justify-content: center; }
.fermer {
  align-self: flex-end;
  border: 0; background: rgba(255,255,255,.14); color: #fff;
  width: 44px; height: 44px; border-radius: 50%; font-size: 1.4rem; line-height: 1;
  flex: none; margin-bottom: 0.6rem;
}

/* Grande enveloppe : ouverture */
.ouverture { width: min(22rem, 92vw); margin: auto 0; text-align: center; }
.grande {
  position: relative;
  width: 100%;
  aspect-ratio: 1.55;
  perspective: 900px;
  border: 0; padding: 0; background: none;
  margin: 3.5rem 0 1rem;
}
.grande .dos {
  position: absolute; inset: 0;
  border-radius: 6px;
  background: #F1F1EA;
  box-shadow: 0 18px 40px -16px rgba(0,0,0,.6);
}
.grande .feuillet {
  position: absolute; left: 7%; right: 7%; top: 8%; height: 84%;
  background: var(--papier);
  border-radius: 3px;
  background-image: linear-gradient(transparent 15px, var(--ligne) 1px);
  background-size: 100% 16px;
  z-index: 2;
  transition: transform 700ms cubic-bezier(.2,.8,.2,1) 420ms;
}
.grande .poche {
  position: absolute; inset: 0; z-index: 3;
  border-radius: 6px;
  background:
    linear-gradient(to top right, #E9E9E0 50%, transparent 50.5%) left bottom / 51% 100% no-repeat,
    linear-gradient(to top left,  #E9E9E0 50%, transparent 50.5%) right bottom / 51% 100% no-repeat,
    linear-gradient(#F4F4EE, #F4F4EE);
  clip-path: polygon(0 0, 50% 56%, 100% 0, 100% 100%, 0 100%);
}
.grande .rabat {
  position: absolute; left: 0; right: 0; top: 0; height: 58%;
  z-index: 4;
  transform-origin: top center;
  transition: transform 520ms cubic-bezier(.5,0,.3,1), z-index 0s linear 260ms;
}
.grande .rabat::before {
  content: ""; position: absolute; inset: 0;
  background: #FAFAF4;
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  border-radius: 6px 6px 0 0;
  filter: drop-shadow(0 2px 2px rgba(0,0,0,.15));
}
.grande .coeur-sceau {
  position: absolute; left: 50%; top: 58%;
  width: 54px; height: 54px; margin: -27px 0 0 -27px;
  z-index: 5;
  color: var(--rouge);
  transition: transform 300ms ease, opacity 300ms ease;
  filter: drop-shadow(0 2px 3px rgba(0,0,0,.25));
}
.grande .bord {
  position: absolute; inset: 0; z-index: 6; pointer-events: none; border-radius: 6px;
  box-shadow: inset 0 0 0 6px transparent;
  background:
    repeating-linear-gradient(-45deg, var(--rouge) 0 9px, #fff 9px 15px, var(--encre) 15px 24px, #fff 24px 30px);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
  padding: 6px;
}
.grande.ouverte .coeur-sceau { transform: scale(1.35) rotate(14deg); opacity: 0; }
.grande.ouverte .rabat { transform: rotateX(180deg); z-index: 1; }
.grande.ouverte .feuillet { transform: translateY(-62%); }
.ouverture .indice { color: #fff; font-family: var(--main); font-size: 1.35rem; margin: 0.4rem 0 0; }
.ouverture .quand-label { color: #fff; font-family: var(--main); font-size: 1.5rem; line-height: 1.25; margin: 0; }

/* La lettre */
.lettre {
  width: min(34rem, 100%);
  background-color: var(--papier);
  color: var(--encre);
  border-radius: 4px;
  box-shadow: 0 24px 60px -24px rgba(0,0,0,.7);
  padding: 1.6rem 1.4rem 1.8rem;
  animation: deplie 520ms cubic-bezier(.2,.8,.2,1);
  transform-origin: top center;
}
@keyframes deplie { from { opacity: 0; transform: translateY(24px) scaleY(0.92); } }
.lettre .entete { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; margin-bottom: 0.4rem; }
.lettre .date { font-family: var(--main); font-size: 1.05rem; color: var(--encre-douce); text-align: right; margin-left: auto; }
.lettre .demande { font-size: 0.85rem; color: var(--encre-douce); margin: 0 0 0.5rem; }
.lettre h2 { font-family: var(--main); font-weight: 700; font-size: 1.7rem; line-height: 1.2; margin: 0.4rem 0 0.4rem; }
.lettre .quand { font-family: var(--main); color: var(--rouge); font-size: 1.15rem; margin: 0; }
.lettre .corps {
  font-family: var(--main);
  font-size: 1.2rem;
  line-height: var(--lh);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  background-image: linear-gradient(transparent calc(var(--lh) - 1px), var(--ligne) 1px);
  background-size: 100% var(--lh);
  margin: 0.6rem 0 0;
  min-height: calc(var(--lh) * 6);
}
.lettre .signature { font-family: var(--main); font-size: 1.6rem; text-align: right; margin: 0.6rem 0 0; transform: rotate(-3deg); }
.lettre .actions { margin-top: 1.6rem; display: flex; flex-wrap: wrap; gap: 0.6rem; justify-content: center; align-items: center; }
.coeur-envoye { color: var(--rouge); font-weight: 600; display: inline-flex; align-items: center; gap: 0.4rem; }
.statut-lettre { width: 100%; text-align: center; font-size: 0.88rem; color: var(--encre-douce); margin: 0; }

/* Carte-réponse ouverte */
.carte {
  width: min(30rem, 100%);
  margin: auto 0;
  background: var(--papier); color: var(--encre);
  border-radius: 6px;
  box-shadow: 0 24px 60px -24px rgba(0,0,0,.7);
  padding: 1.4rem 1.3rem 1.5rem;
  position: relative;
  border-top: 8px solid var(--rose);
  animation: deplie 420ms cubic-bezier(.2,.8,.2,1);
}
.carte .stamp { position: absolute; top: 1rem; right: 1rem; }
.carte .de { font-size: 0.85rem; color: var(--encre-douce); margin: 0; }
.carte h2 { font-family: var(--main); font-weight: 700; font-size: 1.6rem; line-height: 1.2; margin: 0.3rem 4rem 1rem 0; }
.cases { list-style: none; margin: 0 0 1.4rem; padding: 0; }
.cases li { border-bottom: 1px dashed var(--ligne); }
.cases button {
  width: 100%; border: 0; background: none; text-align: left;
  display: flex; align-items: center; gap: 0.8rem;
  padding: 0.7rem 0.1rem;
  font-family: var(--main); font-size: 1.25rem; line-height: 1.25; color: var(--encre);
}
.case {
  flex: none; width: 26px; height: 26px;
  border: 2px solid var(--encre); border-radius: 4px 6px 3px 5px;
  position: relative;
}
.cases button[aria-pressed="true"] .case::after {
  content: ""; position: absolute; left: 7px; top: 1px; width: 8px; height: 15px;
  border: solid var(--rouge); border-width: 0 3.5px 3.5px 0;
  transform: rotate(40deg);
  animation: coche 220ms ease;
}
@keyframes coche { from { opacity: 0; transform: rotate(40deg) scale(0.4); } }
.cases li.surprise button { color: var(--rouge); }

/* Confirmation */
.confirm {
  width: min(22rem, 100%); margin: auto 0;
  background: var(--papier); color: var(--encre);
  border-radius: 10px; padding: 1.3rem; text-align: center;
}
.confirm p { margin: 0 0 1.1rem; }

/* Toast */
.toast {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 1.2rem);
  transform: translateX(-50%);
  z-index: 40;
  background: var(--encre); color: #fff;
  padding: 0.7rem 1.1rem; border-radius: 999px;
  font-weight: 600; font-size: 0.92rem;
  box-shadow: 0 10px 30px -10px rgba(0,0,0,.5);
  animation: monte 260ms ease;
  width: max-content; max-width: calc(100vw - 2rem); text-align: center;
}
@keyframes monte { from { opacity: 0; transform: translate(-50%, 10px); } }

@media (min-width: 560px) {
  .page { padding-top: 2.5rem; }
  .masthead h1 { font-size: 2.5rem; }
  .lettre { padding: 2.2rem 2.4rem 2.4rem; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; transition-delay: 0ms !important; }
}

/* Surfaces papier : couleurs fixes, même en mode sombre */
.env-inner, .lettre, .carte, .confirm, .carte-envoyee, .envoyes button, .alerte-reponse, .carte-teaser, .tag {
  --texte: #1E2547; --encre-douce: #4B5687; color: var(--encre);
}
.quand-grid .par-amour { display: none; }
.btn svg, .coeur-envoye svg { width: 18px; height: 18px; flex: none; }
.lettre.calme { animation: none; }

/* Notifications */
.notif-banniere {
  background: var(--papier); color: var(--encre);
  --texte: #1E2547; --encre-douce: #4B5687;
  border-radius: 6px; box-shadow: var(--ombre);
  border-left: 6px solid var(--encre);
  padding: 0.95rem 1.1rem; margin: 0 0 1.4rem;
}
.notif-banniere p { margin: 0 0 0.7rem; }
.notif-banniere .petit { margin-top: -0.3rem; }
.reglage-notifs { max-width: 24rem; margin: 1.6rem auto 1rem; }
.reglage-notifs .petit { margin: 0 0 0.6rem; }

/* Connexion */
.connexion { text-align: left; margin-top: 0.4rem; }
.connexion .btn--rouge { width: 100%; margin-top: 0.3rem; }
.connexion .btn--lien { display: block; margin: 0.8rem auto 0; }
.connexion .erreur { margin: 0 0 1rem; }
.info { background: #DDEEE2; color: #245A36; border-radius: 6px; padding: 0.7rem 0.9rem; font-size: 0.9rem; margin: 0 0 1rem; }

.masthead .logo { flex: none; width: 56px; height: 56px; border-radius: 14px; box-shadow: 0 6px 16px -8px rgba(30,37,71,.6); }

.logo-ecran { width: 96px; height: 96px; border-radius: 24px; box-shadow: 0 12px 30px -12px rgba(30,37,71,.6); }

  const upd = (name, id, p) => { const o = db[name].find((x) => x.id === id); if (o) Object.assign(o, p); save(); later(name); return Promise.resolve(); };
  const del = (name, id) => { db[name] = db[name].filter((x) => x.id !== id); save(); later(name); return Promise.resolve(); };
  const on = (name, cb) => { subs[name].add(cb); later(name); return () => subs[name].delete(cb); };
  return {
    onLetters: (cb) => on("letters", cb),
    onQuestions: (cb) => on("questions", cb),
    addLetter: (d) => add("letters", d),
    updateLetter: (id, p) => upd("letters", id, p),
    deleteLetter: (id) => del("letters", id),
    addQuestion: (d) => add("questions", d),
    updateQuestion: (id, p) => upd("questions", id, p),
    deleteQuestion: (id) => del("questions", id),
    reset() { lsDel(KEY); db = seedDemo(); save(); emit("letters"); emit("questions"); },
  };
}

function createLiveStore(fb, db) {
  const conv = (d) => {
    const o = { id: d.id, ...d.data() };
    for (const k of DATE_FIELDS) if (o[k] && typeof o[k].toDate === "function") o[k] = o[k].toDate();
    return o;
  };
  const listen = (name, cb, onErr) =>
    fb.onSnapshot(fb.query(fb.collection(db, name), fb.orderBy("createdAt", "desc")), (snap) => cb(snap.docs.map(conv)), onErr);
  return {
    onLetters: (cb, e) => listen("letters", cb, e),
    onQuestions: (cb, e) => listen("questions", cb, e),
    addLetter: async (d) => (await fb.addDoc(fb.collection(db, "letters"), d)).id,
    updateLetter: (id, p) => fb.updateDoc(fb.doc(db, "letters", id), p),
    deleteLetter: (id) => fb.deleteDoc(fb.doc(db, "letters", id)),
    addQuestion: async (d) => (await fb.addDoc(fb.collection(db, "questions"), d)).id,
    updateQuestion: (id, p) => fb.updateDoc(fb.doc(db, "questions", id), p),
    deleteQuestion: (id) => fb.deleteDoc(fb.doc(db, "questions", id)),
  };
}

function stopListeners() { unsubs.forEach((u) => { try { u(); } catch { /* déjà arrêté */ } }); unsubs = []; }
function startListeners() {
  state.ready = { letters: false, questions: false };
  const pret = () => {
    if (!state.ready.letters || !state.ready.questions) return;
    if (state.screen !== "app") { state.screen = "app"; render(); } else refresh();
  };
  const onErr = (err) => {
    console.error(err);
    afficherErreur(err && err.code === "permission-denied"
      ? "La base de données refuse l’accès. Vérifie que les règles Firestore sont publiées et que ton e-mail est bien dans la collection roles."
      : "Impossible de lire le courrier. Vérifie ta connexion puis réessaie.");
  };
  unsubs.push(store.onLetters((list) => { state.letters = list; state.ready.letters = true; pret(); }, onErr));
  unsubs.push(store.onQuestions((list) => { state.questions = list; state.ready.questions = true; pret(); }, onErr));
}

   DÉMARRAGE
   ===================================================================== */
async function demarrer() {
  render();
  if (!LIVE) {
    state.role = lsGet("poste-demo-role") === "kenza" ? "kenza" : "sammy";
    store = createDemoStore();
    startListeners();
    return;
  }
  try {
    const [a, b, c] = await Promise.all([
      import(`${BASE_FB}/firebase-app.js`),
      import(`${BASE_FB}/firebase-auth.js`),
      import(`${BASE_FB}/firebase-firestore.js`),
    ]);
    const fb = { ...a, ...b, ...c };
    const app = fb.initializeApp(CONFIG.firebase);
    live = { fb, app, auth: fb.getAuth(app), db: fb.getFirestore(app) };
  } catch (err) {
    console.error(err);
    return afficherErreur("Firebase n’a pas pu se charger. Vérifie ta connexion internet et la config en haut du fichier.");
  }
  live.fb.onAuthStateChanged(live.auth, async (user) => {
    stopListeners();
    Object.assign(state, { user, role: null, preview: false, letters: [], questions: [], error: "" });
    if (!user) {
      // Pas de compte : chaque téléphone reçoit une identité anonyme, reconnue ensuite grâce à la clé du lien.
      try { await live.fb.signInAnonymously(live.auth); }
      catch (err) { console.error(err); afficherErreur("Impossible d’ouvrir la boîte. Vérifie ta connexion puis réessaie."); }
      return;
    }
    state.screen = "loading"; render();
    try {
      const ref = live.fb.doc(live.db, "membres", user.uid);
      let snap = await live.fb.getDoc(ref);
      const cle = cleDuLien();
      const roleDuLien = cle && cle.startsWith("k_") ? "kenza" : cle && cle.startsWith("s_") ? "sammy" : null;
      // Ce téléphone était reconnu pour l'autre lien : on repart d'une identité neuve.
      if (snap.exists() && roleDuLien && snap.data().role !== roleDuLien) { await live.fb.signOut(live.auth); return; }
      if (!snap.exists() && roleDuLien) {
        try {
          await live.fb.setDoc(ref, { role: roleDuLien, cle, creeLe: new Date() });
          snap = await live.fb.getDoc(ref);
        } catch (err) {
          if (err && err.code !== "permission-denied") throw err;
        }
      }
      if (!snap.exists()) { state.screen = cle ? "lien-invalide" : "sans-lien"; return render(); }
      state.role = snap.data().role;
      store = createLiveStore(live.fb, live.db);
      startListeners();
      rafraichirJeton();
    } catch (err) {
      console.error(err);
      afficherErreur("Impossible d’ouvrir la boîte. Vérifie ta connexion puis réessaie.");
    }
  });
}

function cleDuLien() {
  try { return (new URLSearchParams(location.search).get("cle") || "").trim() || null; } catch { return null; }
}

function etatNotifs() {

const ASTUCE_IOS = "Sur iPhone, ajoute d’abord l’app à ton écran d’accueil depuis cette page (bouton Partager, puis « Sur l’écran d’accueil »), puis ouvre-la depuis l’icône du trésor.";

function htmlBanniereNotifs() {

function htmlReglageNotifs() {

  const e = etatNotifs();

  if (e === "off") return "";
  if (e === "non") corps = `<p class="petit">Ce navigateur ne peut pas recevoir de notifications.</p>`;
  else if (e === "ios") corps = `<p class="petit">Notifications : ${esc(ASTUCE_IOS.charAt(0).toLowerCase() + ASTUCE_IOS.slice(1))}</p>`;
  else if (e === "bloquees") corps = `<p class="petit">Les notifications sont bloquées pour ce site. Tu peux les réautoriser dans les réglages du téléphone.</p>`;
  else if (e === "actives") corps = `<p class="petit">Notifications activées sur cet appareil.</p><button class="btn btn--lien" data-action="desactiver-notifs">Désactiver</button>`;
  else corps = `<p class="petit">${esc(t.detail)}</p><button class="btn btn--clair" data-action="activer-notifs">Activer les notifications</button>`;

async function chargerMessaging() {
  if (live.messaging) return live;
  const m = await import(`${BASE_FB}/firebase-messaging.js`);
  if (!(await m.isSupported())) throw new Error("messaging non supporté");
  live.fbm = m;
  live.messaging = m.getMessaging(live.app);
  m.onMessage(live.messaging, (p) => toast(p.notification?.title || "Nouveau courrier"));
  return live;
}
async function enregistrerJeton() {
  const { fbm, messaging } = await chargerMessaging();
  const sw = `./firebase-messaging-sw.js?config=${encodeURIComponent(JSON.stringify(CONFIG.firebase))}`;
  const reg = await navigator.serviceWorker.register(sw, { scope: "./" });
  await navigator.serviceWorker.ready;
  const jeton = await fbm.getToken(messaging, { vapidKey: CONFIG.vapidKey, serviceWorkerRegistration: reg });
  if (!jeton) throw new Error("aucun jeton");
  const ancien = lsGet(JETON_KEY);
  if (ancien && ancien !== jeton) await live.fb.deleteDoc(live.fb.doc(live.db, "pushTokens", ancien)).catch(() => {});
  await live.fb.setDoc(live.fb.doc(live.db, "pushTokens", jeton), {
    role: state.role,
    uid: state.user.uid,
    url: new URL("./", location.href).href,
    updatedAt: new Date(),
  });
  lsSet(JETON_KEY, jeton);
}
function rafraichirJeton() {
  if (!NOTIFS_ON || !lsGet(JETON_KEY)) return;
  if (!("Notification" in window) || Notification.permission !== "granted") { lsDel(JETON_KEY); return; }
  enregistrerJeton().catch((e) => console.error(e));
}
async function activerNotifs(btn) {
  if (!LIVE) return toast("Les notifications marchent une fois l’app en ligne.");
  if (btn) btn.disabled = true;
  try {
    const permission = await Notification.requestPermission();
    if (permission !== "granted") {
      toast(permission === "denied" ? "Notifications refusées. Tu peux changer d’avis dans les réglages du téléphone." : "Notifications non activées.");
    } else {
      await enregistrerJeton();
      lsDel(PLUS_TARD_KEY);
      toast("Notifications activées");
    }
  } catch (e) {
    console.error(e);
    toast("Les notifications n’ont pas pu être activées sur cet appareil.");
  }
  render();
}
async function desactiverNotifs() {
  const jeton = lsGet(JETON_KEY);
  try {
    if (jeton) await live.fb.deleteDoc(live.fb.doc(live.db, "pushTokens", jeton));
    const { fbm, messaging } = await chargerMessaging();
    await fbm.deleteToken(messaging);
  } catch (e) { console.error(e); }
  lsDel(JETON_KEY);
  toast("Notifications désactivées");
  render();
}

function vueKenza() {

  let sous = "Rien de nouveau pour l’instant.";

  const now = new Date();

    </div>
    <div class="champ"><label for="i-corps">Ta lettre</label>
      <textarea id="i-corps" name="body" class="feuille" placeholder="Ma ${esc(DEST)},"></textarea>
      <p class="petit">Le brouillon reste sur ce téléphone tant que tu ne postes pas.</p>
    </div>
    <div class="champ"><label for="i-sign">Signature</label>
      <input id="i-sign" name="signature" type="text" maxlength="60" autocomplete="off">
    </div>
    <div class="champ"><span class="lab" id="lab-quand">Quand doit-elle arriver ?</span>
      <div class="choix" role="radiogroup" aria-labelledby="lab-quand">
        <label><input type="radio" name="quand" value="maintenant"> Tout de suite</label>
        <label><input type="radio" name="quand" value="date"> Un jour précis</label>
      </div>
      <div id="champ-date" hidden style="margin-top:0.7rem"><input type="datetime-local" name="date" id="i-date" aria-label="Date et heure d’arrivée"></div>
    </div>
    <p id="err-lettre" class="erreur" role="alert" hidden></p>
    <button class="btn btn--rouge" type="submit">Poster la lettre</button>
  </form>`;
}
function htmlDemander() {
  return `<form id="f-carte" novalidate>
    <div class="champ"><label for="q-prompt">Ta question</label>
      <input id="q-prompt" name="prompt" type="text" maxlength="90" autocomplete="off">
    </div>
    <div class="champ"><span class="lab">Les choix que tu lui proposes</span>
      ${[0, 1, 2, 3].map((i) => `<input name="opt${i}" type="text" maxlength="70" autocomplete="off" aria-label="Choix ${i + 1}" placeholder="Choix ${i + 1}${i > 1 ? " (facultatif)" : ""}" style="margin-bottom:0.5rem">`).join("")}
      <p class="petit">« Choisis pour moi » est toujours ajouté en dernier. Touche une idée pour remplir un choix :</p>
      <div class="idees">${IDEES_THEMES.map((v) => `<button type="button" data-action="idee-theme" data-v="${esc(v)}">${esc(v)}</button>`).join("")}</div>
    </div>
    <p id="err-carte" class="erreur" role="alert" hidden></p>
    <button class="btn btn--rouge" type="submit">Envoyer la carte</button>
  </form>
  <h2 class="section">Tes cartes</h2>
  <div id="liste-cartes">${htmlListeCartes()}</div>`;
}
function htmlListeCartes() {
  if (!state.questions.length) return `<div class="vide">Aucune carte envoyée pour l’instant.</div>`;
  return `<div class="liste-cartes">${state.questions.map((q) => {
    const opts = [...q.options, SURPRISE];
    let statut = "En attente de sa réponse.";
    if (q.answer) statut = (q.answer === SURPRISE ? "Elle te laisse choisir" : "Elle a répondu") + ` le ${fmtJour(q.answeredAt)}.` + (q.letterId ? " Lettre écrite." : "");
    return `<div class="carte-envoyee">
      <h3>${esc(q.prompt)}</h3>
      <ul>${opts.map((o) => `<li class="${q.answer === o ? "coche" : ""}">${o === SURPRISE ? "Choisis pour moi" : esc(o)}${q.answer === o ? " ✓" : ""}</li>`).join("")}</ul>
      <p class="statut">${esc(statut)}</p>
      <div class="btn-row">
        ${q.answer && !q.letterId ? `<button class="btn" data-action="ecrire-pour" data-id="${esc(q.id)}">Écrire cette lettre</button>` : ""}
        <button class="btn btn--lien" data-action="supprimer-carte" data-id="${esc(q.id)}">Retirer la carte</button>
      </div>
    </div>`;
  }).join("")}</div>`;
}
function etatLettre(l) {
  const now = new Date();
  if (!isDelivered(l, now)) return { cls: "etat--route", etat: "En chemin", detail: `Arrive le ${fmtJourHeure(when(l))}` };
  if (!l.openedAt && l.type === "quand") return { cls: "", etat: "En réserve", detail: `Dans sa boîte depuis le ${fmtJour(when(l))}` };
  if (!l.openedAt) return { cls: "", etat: "Pas encore lue", detail: `Arrivée le ${fmtJour(when(l))}` };
  return { cls: "etat--ouverte", etat: l.hearted ? "Lue ♥" : "Lue", detail: `Lue le ${fmtJour(l.openedAt)}${l.hearted ? ", avec un cœur" : ""}` };
}
function htmlEnvoye() {
  if (!state.letters.length) return `<div class="vide"><strong>Aucune lettre pour l’instant.</strong>La première t’attend dans l’onglet Écrire.</div>`;
  return `<ul class="envoyes">${state.letters.map((l) => {
    const e = etatLettre(l);
    return `<li><button data-action="lire" data-id="${esc(l.id)}">
      ${timbre(l.id)}
      <span><span class="t">${esc(titreLettre(l))}</span><span class="d">${esc(e.detail)}</span></span>
      <span class="etat ${e.cls}">${esc(e.etat)}</span>
    </button></li>`;
  }).join("")}</ul>`;
}

function remplirFormulaires() {
  const f = document.getElementById("f-lettre");
  if (f) {
    f.elements.condition.value = brouillon.condition;
    f.elements.title.value = brouillon.title;
    f.elements.body.value = brouillon.body;
    f.elements.signature.value = brouillon.signature;
    f.elements.date.value = brouillon.date;
    f.querySelector(`input[name="type"][value="${brouillon.type}"]`).checked = true;
    f.querySelector(`input[name="quand"][value="${brouillon.quand}"]`).checked = true;
    majChampsLettre();
  }
  const c = document.getElementById("f-carte");
  if (c) {
    c.elements.prompt.value = carteBrouillon.prompt;
    carteBrouillon.opts.forEach((v, i) => { c.elements[`opt${i}`].value = v; });
  }
}
function majChampsLettre() {
  const cond = document.getElementById("champ-cond");
  const date = document.getElementById("champ-date");
  if (cond) cond.hidden = brouillon.type !== "quand";
  if (date) date.hidden = brouillon.quand !== "date";
}

/* =====================================================================
   SUPERPOSITIONS : ouverture, lecture, carte-réponse, confirmation
   ===================================================================== */
function ouvrirVoile(html, centre = false) {
  if (!$overlay.innerHTML) lastFocus = document.activeElement;
  $overlay.innerHTML = `<div class="voile${centre ? " voile--centre" : ""}">${html}</div>`;
  document.body.style.overflow = "hidden";
  const cible = $overlay.querySelector("[data-focus]") || $overlay.querySelector("button");
  if (cible) cible.focus({ preventScroll: true });
}
function fermerVoile() {
  $overlay.innerHTML = "";
  document.body.style.overflow = "";
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus({ preventScroll: true });
  lastFocus = null;
}
const boutonFermer = (label = "Fermer") => `<button class="fermer" data-action="fermer" aria-label="${esc(label)}">×</button>`;

function ouvrirLettre(id) {
  const l = byId(id);
  if (!l) return;
  if (l.openedAt) return lireLettre(id);
  ouvrirVoile(`${boutonFermer()}
    <div class="ouverture">
      ${l.type === "quand" ? `<p class="quand-label">Ouvre-moi quand ${esc(l.condition)}</p>` : ""}
      <button class="grande" data-action="decacheter" data-id="${esc(id)}" data-focus aria-label="Ouvrir l’enveloppe">
        <span class="dos"></span><span class="feuillet"></span><span class="poche"></span><span class="rabat"></span>
        <span class="coeur-sceau">${svgCoeur()}</span><span class="bord"></span>
      </button>
      <p class="indice">Touche le cœur pour ouvrir</p>
    </div>`, true);
}
function decacheter(id, btn) {
  if (btn.classList.contains("ouverte")) return;
  btn.classList.add("ouverte");
  const indice = $overlay.querySelector(".indice");
  if (indice) indice.style.visibility = "hidden";
  if (peutAgirKenza()) store.updateLetter(id, { openedAt: new Date() }).catch((e) => { console.error(e); toast("La lettre n’a pas pu être marquée comme lue."); });
  setTimeout(() => { if ($overlay.contains(btn)) lireLettre(id); }, reduceMotion ? 60 : 1250);
}
function lireLettre(id) {
  const l = byId(id);
  if (!l) return fermerVoile();
  const q = l.questionId ? qById(l.questionId) : null;
  const coteSammy = vue() === "sammy";
  let actions = "";
  if (peutAgirKenza()) {
    actions += l.hearted
      ? `<span class="coeur-envoye">${svgCoeur()} Cœur envoyé à ${esc(AUT)}</span>`
      : `<button class="btn btn--rouge" data-action="coeur" data-id="${esc(id)}">${svgCoeur()} Envoyer un cœur à ${esc(AUT)}</button>`;
  }
  if (coteSammy) {
    actions += `<p class="statut-lettre">${esc(etatLettre(l).detail)}.</p>
      <button class="btn btn--clair" data-action="supprimer-lettre" data-id="${esc(id)}">Retirer cette lettre</button>`;
  }
  actions += `<button class="btn${peutAgirKenza() || coteSammy ? " btn--clair" : ""}" data-action="fermer">Ranger la lettre</button>`;
  ouvrirVoile(`${boutonFermer("Ranger la lettre")}
    <article class="lettre" aria-label="${esc(titreLettre(l))}">
      <div class="entete"><p class="date">le ${fmtDate(when(l))}</p></div>
      ${q && q.answer ? `<p class="demande">${q.answer === SURPRISE ? esc(libelleReponse(q, "kenza")) : `Tu avais choisi : ${esc(q.answer)}`}</p>` : ""}
      ${l.type === "quand" ? `<p class="quand">Ouvre-moi quand ${esc(l.condition)}</p>` : ""}
      ${l.title ? `<h2>${esc(l.title)}</h2>` : ""}
      <div class="corps">${esc(l.body)}</div>
      <p class="signature">${esc(l.signature || CONFIG.signature)}</p>
      <div class="actions">${actions}</div>
    </article>`);
}

function ouvrirCarte(id) {
  const q = qById(id);
  if (!q) return;
  const opts = [...q.options, SURPRISE];
  ouvrirVoile(`${boutonFermer()}
    <div class="carte" role="dialog" aria-modal="true" aria-labelledby="carte-titre" data-id="${esc(id)}">
      ${timbre(id)}
      <p class="de">Carte-réponse de ${esc(AUT)}</p>
      <h2 id="carte-titre">${esc(q.prompt)}</h2>
      <ul class="cases">${opts.map((o, i) => `<li class="${o === SURPRISE ? "surprise" : ""}">
        <button data-action="cocher" data-i="${i}" aria-pressed="false" ${i === 0 ? "data-focus" : ""}><span class="case" aria-hidden="true"></span>${o === SURPRISE ? "Choisis pour moi" : esc(o)}</button>
      </li>`).join("")}</ul>
      <button class="btn btn--rouge" data-action="envoyer-carte" data-id="${esc(id)}" disabled>Envoyer ma réponse</button>
      ${state.preview ? `<p class="petit" style="margin-top:0.8rem">Aperçu : seule ${esc(DEST)} peut répondre.</p>` : ""}
    </div>`, true);
}

function confirmer(message, oui, non = "Annuler") {
  return new Promise((resolve) => {
    ouvrirVoile(`<div class="confirm" role="alertdialog" aria-modal="true" aria-label="Confirmation">
      <p>${esc(message)}</p>
      <div class="btn-row" style="justify-content:center">
        <button class="btn btn--clair" data-action="conf-non" data-focus>${esc(non)}</button>
        <button class="btn btn--rouge" data-action="conf-oui">${esc(oui)}</button>
      </div></div>`, true);
    confirmer.resolve = resolve;
  });
}

let toastTimer = null;
function toast(msg) {
  $toast.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $toast.innerHTML = ""; }, 2800);
}

/* =====================================================================
   ACTIONS
   ===================================================================== */
async function action(nom, el) {
  const id = el.dataset.id;
  switch (nom) {
    case "activer-notifs": return activerNotifs(el);
    case "desactiver-notifs": return desactiverNotifs();
    case "notifs-plus-tard": lsSet(PLUS_TARD_KEY, "1"); el.closest(".notif-banniere")?.remove(); return;
    case "recharger": return location.reload();
    case "demo-role":
      state.role = el.dataset.role; state.preview = false; lsSet("poste-demo-role", state.role); fermerVoile(); return render();
    case "reset-demo":
      if (await confirmer("Remettre la démo à zéro ?", "Réinitialiser")) { fermerVoile(); store.reset(); toast("Démo réinitialisée"); } else fermerVoile();
      return;
    case "apercu": state.preview = true; window.scrollTo(0, 0); return render();
    case "fin-apercu": state.preview = false; fermerVoile(); window.scrollTo(0, 0); return render();
    case "onglet": state.tab = el.dataset.tab; return render();

    case "ouvrir-lettre": return ouvrirLettre(id);
    case "decacheter": return decacheter(id, el);
    case "lire": return lireLettre(id);
    case "fermer": return fermerVoile();
    case "coeur":
      el.disabled = true;
      try {
        await store.updateLetter(id, { hearted: true });
        el.outerHTML = `<span class="coeur-envoye">${svgCoeur()} Cœur envoyé à ${esc(AUT)}</span>`;
        toast(`Cœur envoyé à ${AUT}`);
      } catch (e) { console.error(e); el.disabled = false; toast("Le cœur n’est pas parti. Réessaie."); }
      return;

    case "ouvrir-carte": return ouvrirCarte(id);
    case "cocher": {
      const carte = el.closest(".carte");
      carte.querySelectorAll("[data-action='cocher']").forEach((b) => b.setAttribute("aria-pressed", String(b === el)));
      carte.dataset.choix = el.dataset.i;
      carte.querySelector("[data-action='envoyer-carte']").disabled = !peutAgirKenza();
      return;
    }
    case "envoyer-carte": {
      const q = qById(id);
      const i = Number(el.closest(".carte").dataset.choix);
      if (!q || Number.isNaN(i) || !peutAgirKenza()) return;
      const answer = [...q.options, SURPRISE][i];
      el.disabled = true;
      try {
        await store.updateQuestion(id, { answer, answeredAt: new Date() });
        fermerVoile();
        toast(`Réponse envoyée à ${AUT}`);
      } catch (e) { console.error(e); el.disabled = false; toast("La réponse n’est pas partie. Réessaie."); }
      return;
    }

    case "idee-quand":
      brouillon.condition = el.dataset.v; sauverBrouillon();
      document.getElementById("i-cond").value = brouillon.condition;
      return;
    case "idee-theme": {
      const i = carteBrouillon.opts.findIndex((v) => !v.trim());
      if (i === -1) return toast("Les 4 choix sont déjà remplis.");
      carteBrouillon.opts[i] = el.dataset.v;
      document.querySelector(`#f-carte [name="opt${i}"]`).value = el.dataset.v;
      return;
    }
    case "ecrire-pour": {
      const q = qById(id);
      if (!q) return;
      brouillon.questionId = id;
      if (!brouillon.title && q.answer !== SURPRISE) brouillon.title = q.answer;
      sauverBrouillon();
      state.tab = "ecrire";
      render();
      const corps = document.getElementById("i-corps");
      if (corps) { corps.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "center" }); corps.focus({ preventScroll: true }); }
      return;
    }
    case "retirer-q":
      brouillon.questionId = null; sauverBrouillon(); refresh(); return;

    case "supprimer-lettre":
      if (await confirmer("Retirer cette lettre ? Elle disparaîtra aussi de sa boîte.", "Retirer", "Garder")) {
        try {
          await store.deleteLetter(id);
          const q = state.questions.find((x) => x.letterId === id);
          if (q) await store.updateQuestion(q.id, { letterId: null });
          fermerVoile(); toast("Lettre retirée");
        } catch (e) { console.error(e); fermerVoile(); toast("Impossible de retirer la lettre."); }
      } else lireLettre(id);
      return;
    case "supprimer-carte":
      if (await confirmer("Retirer cette carte ?", "Retirer", "Garder")) {
        try { await store.deleteQuestion(id); toast("Carte retirée"); } catch (e) { console.error(e); toast("Impossible de retirer la carte."); }
      }
      fermerVoile();
      return;
    case "conf-oui": confirmer.resolve?.(true); confirmer.resolve = null; return;
    case "conf-non": confirmer.resolve?.(false); confirmer.resolve = null; return;
  }
}

async function posterLettre(form) {
  const err = form.querySelector("#err-lettre");
  const montrer = (m) => { err.textContent = m; err.hidden = false; err.scrollIntoView({ block: "center" }); };
  err.hidden = true;
  const b = brouillon;
  if (!b.body.trim()) return montrer("Écris quelques mots avant de poster.");
  if (b.type === "quand" && !b.condition.trim()) return montrer("Dis-lui quand ouvrir cette lettre.");
  let deliverAt = new Date(Date.now() - 60 * 1000);
  if (b.quand === "date") {
    if (!b.date) return montrer("Choisis le jour et l’heure d’arrivée.");
    deliverAt = new Date(b.date);
    if (Number.isNaN(deliverAt.getTime()) || deliverAt <= new Date()) return montrer("Choisis une date à venir.");
  }
  const bouton = form.querySelector("button[type='submit']");
  bouton.disabled = true;
  try {
    const id = await store.addLetter({
      type: b.type,
      condition: b.type === "quand" ? b.condition.trim() : "",
      title: b.title.trim(),
      body: b.body.replace(/\s+$/, ""),
      signature: b.signature.trim() || CONFIG.signature,
      createdAt: new Date(),
      deliverAt,
      openedAt: null,
      hearted: false,
      notified: false,
      openNotified: false,
      heartNotified: false,
      questionId: b.questionId && qById(b.questionId) ? b.questionId : null,
    });
    if (b.questionId && qById(b.questionId)) await store.updateQuestion(b.questionId, { letterId: id });
    brouillon = nouveauBrouillon();
    sauverBrouillon();
    state.tab = "envoye";
    render();
    window.scrollTo(0, 0);
    toast(b.quand === "date" ? `Lettre programmée pour le ${fmtJour(deliverAt)}` : "Lettre postée");
  } catch (e) {
    console.error(e);
    bouton.disabled = false;
    montrer("La lettre n’est pas partie. Vérifie ta connexion et réessaie. Ton brouillon est gardé.");
  }
}

async function envoyerCarte(form) {
  const err = form.querySelector("#err-carte");
  err.hidden = true;
  const options = carteBrouillon.opts.map((v) => v.trim()).filter(Boolean);
  if (options.length < 2) { err.textContent = "Propose-lui au moins deux choix."; err.hidden = false; return; }
  const bouton = form.querySelector("button[type='submit']");
  bouton.disabled = true;
  try {
    await store.addQuestion({
      prompt: carteBrouillon.prompt.trim() || "Ta prochaine lettre, tu la veux sur…",
      options,
      createdAt: new Date(),
      answer: null,
      answeredAt: null,
      letterId: null,
      notified: false,
      answerNotified: false,
    });
    carteBrouillon = { prompt: "Ta prochaine lettre, tu la veux sur…", opts: ["", "", "", ""] };
    remplirFormulaires();
    bouton.disabled = false;
    toast("Carte envoyée");
  } catch (e) {
    console.error(e);
    bouton.disabled = false;
    err.textContent = "La carte n’est pas partie. Vérifie ta connexion et réessaie.";
    err.hidden = false;
  }
}

/* ---------- Écouteurs ---------- */
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (el && !el.disabled) { e.preventDefault(); action(el.dataset.action, el).catch((err) => console.error(err)); return; }
  if (e.target.classList && e.target.classList.contains("voile") && !$overlay.querySelector(".confirm")) fermerVoile();
});
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape" || !$overlay.innerHTML) return;
  if ($overlay.querySelector(".confirm")) { confirmer.resolve?.(false); confirmer.resolve = null; return; }
  fermerVoile();
});
document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.closest("#f-lettre")) {
    if (t.name in brouillon) brouillon[t.name] = t.value;
    sauverBrouillon();
    if (t.name === "type" || t.name === "quand") majChampsLettre();
  } else if (t.closest("#f-carte")) {
    if (t.name === "prompt") carteBrouillon.prompt = t.value;
    const m = /^opt(\d)$/.exec(t.name);
    if (m) carteBrouillon.opts[Number(m[1])] = t.value;
  }
});
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.closest("#f-lettre") && (t.name === "type" || t.name === "quand")) {
    brouillon[t.name] = t.value; sauverBrouillon(); majChampsLettre();
  }
});
document.addEventListener("submit", (e) => {
  e.preventDefault();
  if (e.target.id === "f-lettre") posterLettre(e.target);
  if (e.target.id === "f-carte") envoyerCarte(e.target);
});
setInterval(() => { if (signatureLivrees() !== derniereSignature) refresh(); }, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && signatureLivrees() !== derniereSignature) refresh(); });

demarrer();

</script>
